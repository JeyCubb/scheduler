<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Schedule Creator</title>
  <meta name="description" content="Visual course schedule creator with real-time timetable calendar, section conflict detection, and curriculum blocks." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <script>
    (function() {
      try {
        var isExplicit = localStorage.getItem('tip_sched_theme_explicit') === 'true';
        var savedTheme = localStorage.getItem('tip_sched_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (isExplicit && savedTheme) ? savedTheme : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=19" />
</head>
<body>
  <div class="app-container">
    <!-- Main Schedule Creator View -->
    <div id="sched-view-container">
      <div class="sched-main-layout">
        <!-- Left Column: Visual Calendar -->
        <div class="sched-calendar-card">
          <div class="sched-grid-wrapper">
            <div class="sched-grid-header">
              <div class="sched-day-label">Time</div>
              <div class="sched-day-label"><span class="day-full">Monday</span><span class="day-short">Mon</span></div>
              <div class="sched-day-label"><span class="day-full">Tuesday</span><span class="day-short">Tue</span></div>
              <div class="sched-day-label"><span class="day-full">Wednesday</span><span class="day-short">Wed</span></div>
              <div class="sched-day-label"><span class="day-full">Thursday</span><span class="day-short">Thu</span></div>
              <div class="sched-day-label"><span class="day-full">Friday</span><span class="day-short">Fri</span></div>
            </div>
            <div class="sched-grid-body" id="sched-calendar-grid">
              <!-- Dynamically populated by JS -->
            </div>
          </div>
        </div>

        <!-- Right Column: Subject & Section Toggle List -->
        <div class="sched-sidebar-card">
          <div class="sched-sidebar-header">
            <div class="sched-sidebar-title">Subjects &amp; Sections</div>
          </div>
          <div id="sched-subject-list">
            <!-- Dynamically populated by JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- App Header & Navigation Toolbar (Symmetrical Brand Trio & Controls) -->
    <header class="app-header">
      <div class="brand-group">
        <a href="https://jeycubb.github.io/TIP-Grade-Calculator/" target="_self" class="brand-nav-btn" id="btn-header-calc" title="Open TIP Grade Calculator (GWA & Target Calculator)" aria-label="Open TIP Grade Calculator">
          <span class="brand-emoji">
            <svg class="brand-calc-emoji" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="calc-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#475569"/>
                  <stop offset="100%" stop-color="#1e293b"/>
                </linearGradient>
                <linearGradient id="calc-bevel-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="calc-lcd-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#0f172a"/>
                  <stop offset="100%" stop-color="#020617"/>
                </linearGradient>
                <linearGradient id="calc-btn-num-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#f8fafc"/>
                  <stop offset="100%" stop-color="#cbd5e1"/>
                </linearGradient>
                <linearGradient id="calc-btn-fn-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#94a3b8"/>
                  <stop offset="100%" stop-color="#64748b"/>
                </linearGradient>
                <linearGradient id="calc-btn-accent" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#fb923c"/>
                  <stop offset="100%" stop-color="#ea580c"/>
                </linearGradient>
              </defs>
              <rect x="5" y="3" width="26" height="30" rx="5.5" fill="url(#calc-body-grad)" stroke="#64748b" stroke-width="0.75"/>
              <rect x="5.5" y="3.5" width="25" height="12" rx="4.8" fill="url(#calc-bevel-gloss)"/>
              <rect x="7.5" y="5.5" width="21" height="7.5" rx="2" fill="url(#calc-lcd-grad)" stroke="#090d16" stroke-width="0.75"/>
              <rect x="23.5" y="7.8" width="3.2" height="3" rx="0.5" fill="#38bdf8"/>
              <text x="21" y="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="5" font-weight="800" fill="#38bdf8" text-anchor="end">12</text>
              <rect x="8" y="15" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-fn-grad)"/>
              <rect x="13.2" y="15" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-fn-grad)"/>
              <rect x="18.5" y="15" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-fn-grad)"/>
              <rect x="23.8" y="15" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-accent)"/>
              <rect x="8" y="19.2" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
              <rect x="13.2" y="19.2" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
              <rect x="18.5" y="19.2" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
              <rect x="23.8" y="19.2" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-accent)"/>
              <rect x="8" y="23.4" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
              <rect x="13.2" y="23.4" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
              <rect x="18.5" y="23.4" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
              <rect x="23.8" y="23.4" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-accent)"/>
              <rect x="8" y="27.6" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
              <rect x="13.2" y="27.6" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
              <rect x="18.5" y="27.6" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-num-grad)"/>
              <rect x="23.8" y="27.6" width="4.2" height="3.2" rx="1" fill="url(#calc-btn-accent)"/>
            </svg>
          </span>
        </a>
        <a href="https://jeycubb.github.io/JeyCub-terms-reviewer/" target="_self" class="brand-nav-btn" id="btn-header-reviewer" title="Open JeyCub Terms Reviewer" aria-label="Open JeyCub Terms Reviewer">
          <span class="brand-emoji">📖</span>
        </a>
        <a href="https://jeycubb.github.io/scheduler/" target="_self" class="brand-nav-btn active" id="btn-header-sched" title="Schedule Creator (Current App)" aria-label="Schedule Creator">
          <span class="brand-emoji">📅</span>
        </a>
      </div>

      <!-- Schedule Preset & Stats Toolbar -->
      <div class="sched-header-toolbar" id="sched-header-toolbar">
        <div class="sched-preset-group">
          <button type="button" class="sched-preset-btn" id="btn-preset-choice-a" title="Load recommended ME32S1 pure block">
            ⚡ Choice A<span class="sched-btn-sub"> (ME32S1 Block)</span>
          </button>
          <button type="button" class="sched-preset-btn" id="btn-preset-choice-b" title="Load Choice B (ME32S2 Fluid Machineries)">
            🔄 Choice B<span class="sched-btn-sub"> (ME32S2 Fluid)</span>
          </button>
          <button type="button" class="sched-preset-btn" id="btn-sched-clear-all" title="Deselect all sections">
            🧹 Clear All
          </button>
        </div>
        <div class="sched-toolbar-stats">
          <div class="sched-stat-item">Enrolled: <span class="sched-stat-badge" id="sched-stat-courses">0 / 11</span></div>
          <div class="sched-stat-item">Units: <span class="sched-stat-badge" id="sched-stat-units">0 / 27</span></div>
        </div>
      </div>

      <!-- Header Action Controls -->
      <div class="header-actions-group">
        <button class="theme-toggle-btn" id="theme-toggle" title="Toggle Light/Dark Theme">
          <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </button>
      </div>
    </header>
  </div>

  <!-- Remove Subject Confirmation Modal Dialog -->
  <div id="sched-remove-modal" class="sched-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="sched-remove-title">
    <div class="sched-modal-card">
      <div class="sched-modal-header">
        <div class="sched-modal-icon-badge" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
            <line x1="10" y1="11" x2="10" y2="17"/>
            <line x1="14" y1="11" x2="14" y2="17"/>
          </svg>
        </div>
        <div class="sched-modal-title-group">
          <h2 id="sched-remove-title" class="sched-modal-title">Remove Subject?</h2>
          <p class="sched-modal-subtitle">Do you want to remove this subject from your schedule?</p>
        </div>
        <button type="button" class="sched-modal-close-btn" id="sched-modal-close-btn" aria-label="Close dialog" title="Close (Esc)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="sched-modal-body">
        <div class="sched-modal-subject-preview" id="sched-modal-subject-preview">
          <!-- Dynamically populated with subject details -->
        </div>
      </div>

      <div class="sched-modal-footer">
        <button type="button" class="sched-modal-btn sched-modal-btn-cancel" id="sched-modal-btn-cancel">
          Cancel
        </button>
        <button type="button" class="sched-modal-btn sched-modal-btn-remove" id="sched-modal-btn-remove">
          Remove Subject
        </button>
      </div>
    </div>
  </div>

  <script src="app.js?v=19"></script>
</body>
</html>
